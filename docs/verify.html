<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified Flex — KeepKey Pendant</title>
<style>
  :root { --bg:#0b0b0d; --panel:#141417; --line:#26262b; --text:#e8e6e1; --dim:#8b8a86; --gold:#f0b90b; --good:#2ecc71; --bad:#e74c3c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,system-ui,sans-serif; min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:430px; padding:28px 20px 60px; }
  .brand { text-align:center; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .brand b { color:var(--gold); }
  .art { width:min(300px,80vw); aspect-ratio:1; border-radius:50%; object-fit:cover; display:block; margin:26px auto 0; background:#1c1c20; box-shadow:0 0 60px #1a1a1e; }
  #badge { text-align:center; font-size:22px; font-weight:700; margin-top:22px; }
  #badge.good { color:var(--good); } #badge.bad { color:var(--bad); } #badge.wait { color:var(--dim); }
  #sub { text-align:center; color:var(--dim); font-size:13px; margin-top:4px; }
  ul { list-style:none; margin-top:26px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 16px; }
  li { display:flex; gap:12px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
  li:last-child { border-bottom:0; }
  li .st { width:20px; text-align:center; }
  li .st.ok { color:var(--good); } li .st.no { color:var(--bad); } li .st.wt { color:var(--dim); }
  li small { display:block; color:var(--dim); font-family:ui-monospace,monospace; font-size:11px; word-break:break-all; }
  footer { text-align:center; color:var(--dim); font-size:12px; margin-top:26px; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <div class="brand">Verified flex · <b>KeepKey</b> pendant</div>
  <img class="art" id="art" alt="" crossorigin="anonymous">
  <div id="badge" class="wait">Verifying…</div>
  <div id="sub"></div>
  <ul id="checks"></ul>
  <button id="wallBtn" style="display:none;width:100%;margin-top:18px;background:var(--gold);color:#111;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer">Make phone wallpaper</button>
  <footer>Verification runs live in your browser against the blockchain.<br>No server involved. Powered by <a href="https://keepkey.com">KeepKey</a>.</footer>
</main>
<div id="wallOverlay" style="display:none;position:fixed;inset:0;background:#000;z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px" onclick="this.style.display='none'">
  <img id="wallImg" style="max-height:78vh;max-width:92vw;border-radius:18px;border:1px solid #333">
  <div style="color:#e8e6e1;font-size:14px;text-align:center">Press and hold the image → <b>Save Image</b>,<br>then set it as your wallpaper in Photos.</div>
  <div style="color:#8b8a86;font-size:12px">tap anywhere to close</div>
</div>
<script type="module" src="./verify.bundle.js"></script>
</body>
</html>
